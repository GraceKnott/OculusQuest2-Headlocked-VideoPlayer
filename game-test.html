<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Head-Locked itch.io Game Test</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; color: white; font: 16px system-ui, sans-serif; }
    #overlay { width: 100vw; height: 100vh; height: 100dvh; background: #111; }
    #game { display: block; width: 100%; height: 100%; border: 0; background: #111; }
    #controls { position: fixed; z-index: 3; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; padding: 12px; background: #222e; border-radius: 12px; }
    #controls p { margin: 0 0 8px; }
    button { padding: 10px 14px; font: inherit; }
    #status { color: #ddd; font-size: 14px; margin-top: 8px; }
    body.in-xr #controls { display: none; }
  </style>
</head>
<body>
  <div id="overlay">
    <iframe id="game" title="Feedback System itch.io game" src="https://html-classic.itch.zone/html/19388696-2085129/index.html?v=1791421353" allow="autoplay; fullscreen *; geolocation; microphone; camera; midi; monetization; xr-spatial-tracking; gamepad; gyroscope; accelerometer; xr; cross-origin-isolated; web-share" allowfullscreen></iframe>
    <div id="controls">
      <p>This test opens the itch.io game as a full-view WebXR overlay. It only works if Quest Browser supports DOM overlays in VR and itch.io permits embedding.</p>
      <button id="enter">Try head-locked mode</button>
      <div id="status">First, check that the game loads below this message.</div>
    </div>
  </div>
  <script type="module">
    const button = document.querySelector('#enter');
    const status = document.querySelector('#status');
    button.addEventListener('click', async () => {
      if (!navigator.xr) {
        status.textContent = 'WebXR is unavailable. Open this HTTPS page in Meta Quest Browser.';
        return;
      }
      try {
        if (!await navigator.xr.isSessionSupported('immersive-vr')) {
          throw new Error('This browser does not support immersive VR.');
        }
        const session = await navigator.xr.requestSession('immersive-vr', {
          requiredFeatures: ['dom-overlay'],
          domOverlay: { root: document.querySelector('#overlay') }
        });
        document.body.classList.add('in-xr');
        session.addEventListener('end', () => document.body.classList.remove('in-xr'));
      } catch (error) {
        status.textContent = 'Head-locked overlay was not available: ' + error.message;
      }
    });
  </script>
</body>
</html>
