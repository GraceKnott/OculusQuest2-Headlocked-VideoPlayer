<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Nimja Spiral Head-Lock Test</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; font: 16px system-ui, sans-serif; }
    #overlay { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; background: #000; }
    #visual { display: block; width: 100%; height: 100%; border: 0; background: #000; }
    #controls { position: fixed; z-index: 4; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; padding: 12px; border-radius: 12px; background: #191922ee; box-shadow: 0 2px 12px #0009; }
    #controls p { margin: 0 0 8px; }
    button, select { padding: 10px 14px; font: inherit; }
    #picker { display: grid; grid-template-columns: auto minmax(170px, 1fr); gap: 8px; align-items: center; margin: 8px 0; }
    #catalogue { color: #c7dcff; }
    #status { margin-top: 8px; color: #ddd; font-size: 14px; }
    #controls-toggle {
      position: fixed; z-index: 5; right: 12px; bottom: 12px;
      width: 30px; height: 30px; padding: 0; border: 1px solid #fff;
      border-radius: 50%; background: #111; color: #fff;
      font-size: 18px; line-height: 1; opacity: .12;
      transition: opacity .18s ease;
    }
    #controls-toggle:hover, #controls-toggle:focus-visible { opacity: .9; }
    body.controls-hidden #controls { display: none; }
  </style>
</head>
<body>
  <div id="overlay">
    <iframe id="visual" title="Nimja Spiral Web visual"
      src="https://hypno.nimja.com/visual/76"
      allow="autoplay; fullscreen *; xr-spatial-tracking; gamepad"
      allowfullscreen></iframe>
    <div id="controls">
      <p>Choose a Nimja visual, start it in the frame, then enter head-locked mode. The visual fills your view and follows your headset.</p>
      <label id="picker" for="visual-choice"><span>Choose visual</span>
        <select id="visual-choice">
          <optgroup label="Spirals">
            <option value="154">Glass Spiral</option>
            <option value="150">Rainbow Spiral</option>
            <option value="141">Glitter Spiral</option>
            <option value="139">Polar Spiral</option>
            <option value="133">Flowing Spiral</option>
            <option value="131">Chromatic Spiral</option>
            <option value="121">Fuzzy Spiral</option>
            <option value="117">Digital Spiral</option>
            <option value="111">Spiral Words</option>
            <option value="110">Spiral Zoom</option>
            <option value="109">Distant Spiral</option>
            <option value="102">Double Spiral</option>
            <option value="100">Fractured Spiral</option>
            <option value="76" selected>Spiral Web</option>
            <option value="75">Particle Spiral</option>
            <option value="57">Deep Spiral Dots</option>
            <option value="54">Spiral Twist Flat</option>
            <option value="53">Spiral Twist Smooth</option>
            <option value="30">Circle Spiral</option>
            <option value="23">Spiral Intense</option>
            <option value="18">Soft Spiral</option>
            <option value="9">Spiral Large (rainbow)</option>
          </optgroup>
          <optgroup label="Other visuals">
            <option value="145">Aperture Spiral</option>
            <option value="132">Spiral Corridor</option>
            <option value="93">Pendulum Waves</option>
            <option value="91">Enspiralment</option>
            <option value="86">Warp Tunnel</option>
          </optgroup>
        </select>
      </label>
      <a id="catalogue" href="https://hypno.nimja.com/visual" target="_blank" rel="noopener">Browse Nimja’s full visual catalogue</a>
      <button id="enter">Try head-locked mode</button>
      <div id="status">Press “Start Visual” inside the frame before trying head-locked mode. Some visuals may flash.</div>
    </div>
    <button id="controls-toggle" type="button" aria-label="Hide controls" aria-expanded="true" title="Hide or show controls">·</button>
  </div>
  <script>
    const button = document.querySelector('#enter');
    const status = document.querySelector('#status');
    const overlay = document.querySelector('#overlay');
    const choice = document.querySelector('#visual-choice');
    const controlsToggle = document.querySelector('#controls-toggle');

    controlsToggle.addEventListener('click', () => {
      const hidden = document.body.classList.toggle('controls-hidden');
      controlsToggle.setAttribute('aria-expanded', String(!hidden));
      controlsToggle.setAttribute('aria-label', hidden ? 'Show controls' : 'Hide controls');
      controlsToggle.title = hidden ? 'Show controls' : 'Hide controls';
    });

    choice.addEventListener('change', () => {
      document.querySelector('#visual').src = 'https://hypno.nimja.com/visual/' + encodeURIComponent(choice.value);
      status.textContent = 'Visual changed. Press “Start Visual” inside the frame, then try head-locked mode.';
    });

    button.addEventListener('click', async () => {
      if (!navigator.xr) {
        status.textContent = 'WebXR is unavailable. Open this HTTPS page in Meta Quest Browser.';
        return;
      }

      let session;
      try {
        if (!await navigator.xr.isSessionSupported('immersive-vr')) {
          throw new Error('This browser does not support immersive VR.');
        }

        session = await navigator.xr.requestSession('immersive-vr', {
          optionalFeatures: ['dom-overlay'],
          domOverlay: { root: overlay }
        });

        // XRSession.enabledFeatures is normally an array, not a Set.
        // Keep compatibility with browsers that expose it as a Set or omit it.
        const enabledFeatures = session.enabledFeatures;
        const domOverlayEnabled = enabledFeatures == null
          ? true
          : (typeof enabledFeatures.includes === 'function'
              ? enabledFeatures.includes('dom-overlay')
              : typeof enabledFeatures.has === 'function'
                ? enabledFeatures.has('dom-overlay')
                : false);

        if (!domOverlayEnabled) {
          await session.end();
          session = null;
          throw new Error('Quest Browser did not enable DOM overlays for this VR session.');
        }

        document.body.classList.add('in-xr', 'controls-hidden');
        controlsToggle.setAttribute('aria-expanded', 'false');
        controlsToggle.setAttribute('aria-label', 'Show controls');
        controlsToggle.title = 'Show controls';

        session.addEventListener('end', () => {
          document.body.classList.remove('in-xr', 'controls-hidden');
          controlsToggle.setAttribute('aria-expanded', 'true');
          controlsToggle.setAttribute('aria-label', 'Hide controls');
          controlsToggle.title = 'Hide or show controls';
        }, { once: true });

        status.textContent = 'Head-locked session started. If the overlay is still black, the browser may not support the required DOM overlay behavior.';
      } catch (error) {
        status.textContent = 'Head-locked overlay unavailable: ' + (error?.message || String(error));
      }
    });
  </script>
</body>
</html>
