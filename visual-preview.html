    ctx.fillStyle='#d8d8ed';ctx.shadowColor='#c2a4ff';ctx.shadowBlur=14;ctx.fill();ctx.shadowBlur=0;
    const radius=Math.max(22,h*.082),metal=ctx.createRadialGradient(bobX-radius*.35,bobY-radius*.42,radius*.05,bobX,bobY,radius);
    metal.addColorStop(0,'#fff8ff');metal.addColorStop(.18,'#c6b5e5');metal.addColorStop(.48,'#655b8e');metal.addColorStop(.8,'#25223d');metal.addColorStop(1,'#090a14');
    ctx.beginPath();ctx.arc(bobX,bobY,radius,0,TAU);ctx.fillStyle=metal;ctx.shadowColor='#b59aff';ctx.shadowBlur=20;ctx.fill();ctx.shadowBlur=0;
    ctx.save();ctx.translate(bobX,bobY);ctx.beginPath();
    for(let i=0;i<=180;i++) {
      const u=i/180,theta=u*TAU*3.2-t*1.1,rr=radius*.035+u*radius*.72;
      const x=Math.cos(theta)*rr,y=Math.sin(theta)*rr;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.strokeStyle='rgba(255,247,255,.94)';ctx.lineWidth=Math.max(1.5,radius*.045);ctx.stroke();
    ctx.beginPath();ctx.arc(-radius*.28,-radius*.34,radius*.13,0,TAU);ctx.fillStyle='rgba(255,255,255,.55)';ctx.fill();
    ctx.restore();ctx.restore();
  }

  function draw(target,preset,time) {
    if(preset[1]==='fuzzy')drawFuzzy(target,time);
    else if(preset[1]==='intense')drawIntense(target,time);
    else if(preset[1]==='tentacles')drawTentacles(target,time);
    else drawPendulum(target,time);
  }

  function drawXrCue(target,time) {
    if(!selected||!cueActive)return;
    const phrases=messageInput.value.split(/\n/).map(line=>line.trim()).filter(Boolean);
    if(!phrases.length)return;
    // Use a monotonic performance timestamp at the XR call site as XR frame
    // timestamps can have a different origin in some headset browsers.
    const elapsed=Math.max(0,time-cueStarted),period=Number(cueInterval.value),cuePhase=elapsed%period;
    if(cuePhase>=Number(cueDuration.value))return;
    const ctx=target.ctx,phrase=phrases[Math.floor(elapsed/period)%phrases.length];
    ctx.save();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.setTransform(1,0,0,1,0,0);
    if(flashMode.checked){ctx.fillStyle='#fff';ctx.fillRect(0,0,target.w,target.h);ctx.fillStyle='#000';}
    else {ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.95)';ctx.shadowBlur=8;ctx.shadowOffsetX=1;ctx.shadowOffsetY=2;}
    ctx.font=`600 ${Math.max(18,Math.round(target.h*.05))}px system-ui,sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    const maxWidth=target.w*.9,words=phrase.split(/\s+/),lines=[];let line='';
    for(const word of words){const next=line?`${line} ${word}`:word;if(line&&ctx.measureText(next).width>maxWidth){lines.push(line);line=word;}else line=next;}
    if(line)lines.push(line);
    const lineHeight=target.h*.062,startY=target.h/2-(lines.length-1)*lineHeight/2;
    lines.forEach((text,index)=>ctx.fillText(text,target.w/2,startY+index*lineHeight,maxWidth));
    ctx.restore();
  }

  const active=[];
  presets.forEach(preset=>{
    const button=document.createElement('button');button.className='card';button.type='button';
    const canvas=document.createElement('canvas');canvas.width=240;canvas.height=240;
    const label=document.createElement('div');label.className='label';label.textContent=preset[0];
    const description=document.createElement('div');description.className='description';description.textContent=preset[2];
    button.append(canvas,label,description);gallery.append(button);
    const target=targetFor(canvas);active.push({target,preset});
    button.addEventListener('click',()=>open(preset));
  });
  function sizeViewer(){const d=Math.min(devicePixelRatio||1,1.5);large.width=Math.floor(innerWidth*d);large.height=Math.floor(innerHeight*d);}
  function open(preset){
    selected=preset;title.textContent=preset[0]+' — click × or press Esc to close';
    messageInput.value=(preset[3]||[]).join('\n');ambienceToggle.textContent=ambienceOn?'Stop ambience':`Start ${preset[0]} ambience`;
    creativeControls.classList.remove('open');menuToggle.setAttribute('aria-expanded','false');menuToggle.setAttribute('aria-label','Open visual controls');
    if(cueActive)cueStarted=performance.now()*.001;
    viewer.classList.add('open');document.body.classList.add('viewing');sizeViewer();
    if(ambienceOn)startProfile(preset[1]);
  }
  function close(){
    selected=null;viewer.classList.remove('open');document.body.classList.remove('viewing');
    cueActive=false;messageToggle.textContent='Start cue';messageOverlay.classList.remove('visible');viewer.classList.remove('flash-active');
    creativeControls.classList.remove('open');menuToggle.setAttribute('aria-expanded','false');menuToggle.setAttribute('aria-label','Open visual controls');
    if(ambienceOn&&audioContext){ambienceOn=false;ambienceGain.gain.setTargetAtTime(0,audioContext.currentTime,.3);clearProfile(.6);ambienceToggle.textContent='Start ambience';}
  }
  document.querySelector('#close').addEventListener('click',close);
  viewer.addEventListener('click',e=>{if(e.target===viewer)close();});
  addEventListener('keydown',e=>{if(e.key==='Escape')close();});
  addEventListener('resize',()=>{if(selected)sizeViewer();xrCamera.aspect=innerWidth/innerHeight;xrCamera.updateProjectionMatrix();xrRenderer.setSize(innerWidth,innerHeight);});
  let last=0,lastThumb=0;
  function frame(ms){
    const t=ms*.001;
    if(!document.hidden&&!xrRenderer.xr.isPresenting&&t-last>=1/24){
      if(selected)draw(largeTarget,selected,t);
      else if(t-lastThumb>=1/12){for(const item of active)draw(item.target,item.preset,t);lastThumb=t;}
      if(selected&&cueActive) {
        const phrases=messageInput.value.split(/\n/).map(line=>line.trim()).filter(Boolean);
        const elapsed=t-cueStarted,period=Number(cueInterval.value),cuePhase=elapsed%period;
        if(phrases.length) {
          messageOverlay.textContent=phrases[Math.floor(elapsed/period)%phrases.length];
          const cueVisible=cuePhase<Number(cueDuration.value);
          messageOverlay.classList.toggle('visible',cueVisible);
          viewer.classList.toggle('flash-active',flashMode.checked&&cueVisible);
        } else { messageOverlay.classList.remove('visible');viewer.classList.remove('flash-active'); }
      } else { messageOverlay.classList.remove('visible');viewer.classList.remove('flash-active'); }
      last=t;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  xrRenderer.setAnimationLoop(ms=>{
    if(!xrRenderer.xr.isPresenting)return;
    const t=ms*.001;
    const head=xrRenderer.xr.getCamera(xrCamera);
    if(!xrScreenSizedForSession&&head.cameras?.length){
      let width=0,height=0;
      for(const eye of head.cameras){
        const projection=eye.projectionMatrix.elements;
        width=Math.max(width,2*xrScreenDistance/Math.abs(projection[0]));
        height=Math.max(height,2*xrScreenDistance/Math.abs(projection[5]));
      }
      const aspect=width/height;
      if(aspect>=1){xrArtCanvas.width=xrTextureMaxSide;xrArtCanvas.height=Math.max(1,Math.round(xrTextureMaxSide/aspect));}
      else {xrArtCanvas.height=xrTextureMaxSide;xrArtCanvas.width=Math.max(1,Math.round(xrTextureMaxSide*aspect));}
      // Small overscan covers eye-offset and lens-edge variation without
      // unnecessarily cropping the visual as the previous square page did.
      const overscan=1.04;
      xrScreen.scale.set(width*overscan,height*overscan,1);
      xrTexture.needsUpdate=true;
      xrScreenSizedForSession=true;
    }
    if(selected&&t-lastXrDraw>=1/30){draw(xrArtTarget,selected,t);drawXrCue(xrArtTarget,performance.now()*.001);xrTexture.needsUpdate=true;lastXrDraw=t;}
    const forward=new THREE.Vector3(0,0,-1).applyQuaternion(head.quaternion);
    xrScreen.position.copy(head.position).addScaledVector(forward,xrScreenDistance);
    xrScreen.quaternion.copy(head.quaternion);
    xrRenderer.render(xrScene,xrCamera);
  });
})();
</script>
</body>
